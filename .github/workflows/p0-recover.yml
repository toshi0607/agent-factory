name: P0 session recovery

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      mode:
        type: string
        required: true
      candidate:
        type: string
        default: managed-agents
      worker_audience:
        type: string
        default: ''
      factory_ref:
        type: string
        required: true
      federation_rule_id:
        type: string
        required: true
      organization_id:
        type: string
        required: true
      service_account_id:
        type: string
        required: true
      workspace_id:
        type: string
        required: true
      gcp_wif_provider:
        type: string
        default: ''
      gcp_work_service_account:
        type: string
        default: ''
      state_bucket:
        type: string
        default: ''
    secrets:
      worker_url:
        required: false

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      FACTORY_WORKER_AUDIENCE: ${{ inputs.worker_audience }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
      ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
      ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
    steps:
      - name: Validate factory ref
        shell: bash
        env:
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          if [[ ! "$FACTORY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'factory_ref must be a full lowercase commit SHA\n' >&2
            exit 1
          fi
      - name: Validate recovery inputs
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            printf 'run_id must contain only digits\n' >&2
            exit 1
          fi
          if [[ "$MODE" != collect && "$MODE" != cleanup ]]; then
            printf 'mode must be collect or cleanup\n' >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          repository: toshi0607/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.26.11'
          check-latest: false
          cache: false
      - name: Build session CLI
        working-directory: factory
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/session" ./cmd/session
      - name: Set factory commit
        run: |
          factory_commit="$(git -C factory rev-parse HEAD)"
          printf 'FACTORY_COMMIT=%s\n' "$factory_commit" >> "$GITHUB_ENV"
      - name: Create state artifact directory
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          mkdir "$RUNNER_TEMP/artifacts/p0-state"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: p0-state
          path: ${{ runner.temp }}/artifacts/p0-state
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Validate state artifact
        run: |
          shopt -s dotglob nullglob
          entries=("$RUNNER_TEMP/artifacts/p0-state"/*)
          state="$RUNNER_TEMP/artifacts/p0-state/state.json"
          if [[ ${#entries[@]} -ne 1 || ! -f "$state" || -L "$state" ]]; then
            printf 'Expected the p0-state artifact to contain only a regular state.json file\n' >&2
            exit 1
          fi
          printf 'P0_STATE_PATH=%s\n' "$state" >> "$GITHUB_ENV"
      - name: Collect session outputs
        if: inputs.mode == 'collect'
        env:
          FACTORY_WORKER_URL: ${{ secrets.worker_url }}
          FACTORY_GCP_WIF_PROVIDER: ${{ inputs.gcp_wif_provider }}
          FACTORY_GCP_SERVICE_ACCOUNT: ${{ inputs.gcp_work_service_account }}
          FACTORY_STATE_BUCKET: ${{ inputs.state_bucket }}
        run: 'exec "$RUNNER_TEMP/bin/session" collect -state "$P0_STATE_PATH" -out "$RUNNER_TEMP/out"'
      - uses: actions/upload-artifact@v7.0.2
        if: always() && inputs.mode == 'collect'
        with:
          name: p0-collected
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
      - name: Clean up session
        if: inputs.mode == 'cleanup'
        env:
          FACTORY_WORKER_URL: ${{ secrets.worker_url }}
          FACTORY_GCP_WIF_PROVIDER: ${{ inputs.gcp_wif_provider }}
          FACTORY_GCP_SERVICE_ACCOUNT: ${{ inputs.gcp_work_service_account }}
          FACTORY_STATE_BUCKET: ${{ inputs.state_bucket }}
        run: 'exec "$RUNNER_TEMP/bin/session" cleanup -state "$P0_STATE_PATH"'

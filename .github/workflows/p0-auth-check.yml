name: P0 federation check

on:
  workflow_call:
    inputs:
      factory_ref:
        type: string
        required: true
      federation_rule_id:
        type: string
        required: true
      organization_id:
        type: string
        required: true
      service_account_id:
        type: string
        required: true
      workspace_id:
        type: string
        required: true
      hold_seconds:
        type: string
        default: ''
      messages_model:
        type: string
        default: ''

permissions: {}

jobs:
  auth-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate factory ref
        shell: bash
        env:
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          if [[ ! "$FACTORY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'factory_ref must be a full lowercase commit SHA\n' >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          repository: toshi0607/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.26.11'
          check-latest: false
          cache: false
      - name: Build session CLI
        working-directory: factory
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: go build -o "$RUNNER_TEMP/session" ./cmd/session
      - name: Print OIDC claims
        run: 'exec "$RUNNER_TEMP/session" oidc-claims'
      - name: Set factory commit
        run: |
          factory_commit="$(git -C factory rev-parse HEAD)"
          printf 'FACTORY_COMMIT=%s\n' "$factory_commit" >> "$GITHUB_ENV"
      - name: Check Anthropic federation
        shell: bash
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
          ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
          ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
          MESSAGES_MODEL: ${{ inputs.messages_model }}
        run: |
          if [[ -n "$MESSAGES_MODEL" ]]; then
            if [[ -n "$HOLD_SECONDS" ]]; then
              printf 'messages_model and hold_seconds cannot be combined\n' >&2
              exit 1
            fi
            if [[ ! "$MESSAGES_MODEL" =~ ^claude-[a-z0-9-]{1,60}$ ]]; then
              printf 'messages_model must match ^claude-[a-z0-9-]{1,60}$\n' >&2
              exit 1
            fi
            exec "$RUNNER_TEMP/session" auth-check -messages "$MESSAGES_MODEL"
          fi
          if [[ -z "$HOLD_SECONDS" ]]; then
            exec "$RUNNER_TEMP/session" auth-check
          fi
          if [[ ! "$HOLD_SECONDS" =~ ^[1-9][0-9]{0,3}$ || "$HOLD_SECONDS" -gt 1200 ]]; then
            printf 'hold_seconds must be an integer from 1 to 1200\n' >&2
            exit 1
          fi
          exec "$RUNNER_TEMP/session" auth-check -hold "${HOLD_SECONDS}s"

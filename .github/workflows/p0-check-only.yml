name: P0 check only

on:
  workflow_call:
    inputs:
      task:
        type: string
        required: true
      factory_ref:
        type: string
        required: true
      patch_base64:
        type: string
        default: ''

permissions: {}

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHECK_IMAGE: golang:1.26.11-bookworm@sha256:dc40a13b61304647ed7e5d581d246b86413dfc29d63c6d018310feb93cd98fc0
    steps:
      - name: Validate factory ref
        shell: bash
        env:
          FACTORY_REF: ${{ inputs.factory_ref }}
        run: |
          if [[ ! "$FACTORY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'factory_ref must be a full lowercase commit SHA\n' >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: product
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: toshi0607/agent-factory
          ref: ${{ inputs.factory_ref }}
          path: factory
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.26.11'
          check-latest: false
          cache: false
      - name: Build factory CLIs
        working-directory: factory
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/p0check" ./cmd/p0check
          go build -o "$RUNNER_TEMP/bin/checkpatch" ./cmd/checkpatch
      - name: Archive the product
        run: git -C product archive --format=tar.gz -o "$RUNNER_TEMP/product.tar.gz" HEAD
      - name: Populate the product module cache
        env:
          GOPROXY: https://proxy.golang.org
          GOVCS: '*:off'
          GOENV: 'off'
          GOWORK: 'off'
        run: |
          export GOMODCACHE="$RUNNER_TEMP/modcache"
          modules="$(mktemp -d "$RUNNER_TEMP/p0-modules.XXXXXXXX")"
          mkdir -p "$GOMODCACHE"
          tar -xzf "$RUNNER_TEMP/product.tar.gz" -C "$modules"
          cd "$modules"
          go mod download
      - name: Pull the check image
        run: docker pull "$CHECK_IMAGE"
      - name: Check the product
        working-directory: factory
        env:
          TASK: ${{ inputs.task }}
          PATCH_BASE64: ${{ inputs.patch_base64 }}
        run: |
          args=(-no-patch)
          if [[ -n "$PATCH_BASE64" ]]; then
            printf '%s' "$PATCH_BASE64" | base64 -d > "$RUNNER_TEMP/patch.diff"
            args=(-patch "$RUNNER_TEMP/patch.diff")
          fi
          status=0
          "$RUNNER_TEMP/bin/checkpatch" -product-archive "$RUNNER_TEMP/product.tar.gz" "${args[@]}" \
            -task "$TASK" -p0check "$RUNNER_TEMP/bin/p0check" -work "$RUNNER_TEMP/work" \
            -runner docker -image "$CHECK_IMAGE" -modcache "$RUNNER_TEMP/modcache" \
            > "$RUNNER_TEMP/checkresult.json" || status=$?
          {
            printf '### P0 check result (exit %s)\n\n```json\n' "$status"
            cat "$RUNNER_TEMP/checkresult.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ $status == 2 ]]; then
            exit 2
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: p0-check-result
          path: ${{ runner.temp }}/checkresult.json
          if-no-files-found: warn

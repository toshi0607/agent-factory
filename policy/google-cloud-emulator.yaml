# P0 (PoC) subset of the policy file. Numbers are provisional.
product:
  repository: toshi0607/google-cloud-emulator
  module: github.com/toshi0607/google-cloud-emulator
toolchain:
  go:
    version: go1.26.11
    filename: go1.26.11.linux-amd64.tar.gz
    url: https://go.dev/dl/go1.26.11.linux-amd64.tar.gz
    sha256: 9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec
    size_bytes: 66999944
pricing:
  claude-opus-5-5:
    input: 400
    output: 2000
    cache_write_5m: 500
    cache_write_1h: 800
    cache_read: 20
  # Haiku 5.5 has two price tiers by prompt length. The higher tier is used so
  # the budget never undercounts.
  claude-haiku-5-5:
    input: 50
    output: 250
    cache_write_5m: 62.5
    cache_write_1h: 100
    cache_read: 5
egress:
  gomod:
    allowed_hosts:
      - proxy.golang.org
      - sum.golang.org
  # PoC only: the module proxy limited to the modules named in the product's go.sum.
  gomod-pinned:
    allowed_hosts:
      - sum.golang.org
    path_rules:
      - host: proxy.golang.org
        path_prefixes:
          - /cloud.google.com/go/cloudtasks/@v/
          - /cloud.google.com/go/iam/@v/
          - /cloud.google.com/go/longrunning/@v/
          - /cloud.google.com/go/pubsub/v2/@v/
          - /cloud.google.com/go/secretmanager/@v/
          - /connectrpc.com/connect/v2/@v/
          - /connectrpc.com/vanguard/@v/
          - /go.yaml.in/yaml/v3/@v/
          - /golang.org/x/net/@v/
          - /golang.org/x/sys/@v/
          - /golang.org/x/text/@v/
          - /google.golang.org/genproto/@v/
          - /google.golang.org/genproto/googleapis/api/@v/
          - /google.golang.org/genproto/googleapis/rpc/@v/
          - /google.golang.org/grpc/@v/
          - /google.golang.org/protobuf/@v/
roles:
  fixer:
    write: [services/*/*.go]
    agent: claude
    model: claude-opus-5-5
    prompt: prompts/fixer.md
    egress: [gomod]
    budget:
      llm_usd_cents: 300
      minutes: 30
  probe:
    agent: claude
    model: claude-haiku-5-5
    prompt: prompts/probe.md
    egress: [gomod]
    budget:
      llm_usd_cents: 100
      minutes: 10
  fixer-pinned:
    agent: claude
    model: claude-opus-5-5
    prompt: prompts/fixer.md
    egress: [gomod-pinned]
    budget:
      llm_usd_cents: 300
      minutes: 30

  # F0: a probe with no egress at all, to show that nothing is reachable.
  probe-isolated:
    agent: claude
    model: claude-haiku-5-5
    prompt: prompts/probe.md
    egress: []
    budget:
      llm_usd_cents: 100
      minutes: 10
reflect:
  target_refs: [refs/heads/factory-f0]
  generated:
    - "**/*.gen.go"
    - docs/coverage/**
    - snapshot.json
    - services/*/snapshot.json
    - "**/unimplemented.json"
  generated_outputs:
    - docs/coverage/*.md
    - internal/protos/protos.gen.go
    - services/register.gen.go
    - services/*/elements.gen.go
    - services/*/register.gen.go
    - services/*/snapshot.json
    - services/*/unimplemented.json
  dependency_files: [go.mod, go.sum, go.work, go.work.sum, "**/go.mod", "**/go.sum", "**/go.work", "**/go.work.sum"]
  protected:
    - Makefile

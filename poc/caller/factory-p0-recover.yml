name: factory-p0-recover

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Earlier P0 workflow run ID
        type: string
        required: true
      mode:
        type: choice
        required: true
        options:
          - collect
          - cleanup

permissions: {}

jobs:
  recover:
    permissions:
      id-token: write
      contents: read
      actions: read
    # Replace both FACTORY_SHA placeholders with the same factory commit SHA.
    uses: toshi0607/agent-factory/.github/workflows/p0-recover.yml@FACTORY_SHA
    with:
      run_id: ${{ inputs.run_id }}
      mode: ${{ inputs.mode }}
      factory_ref: FACTORY_SHA
      federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
